name: Stock Alpha V1
on:
  pull_request:
    branches: [main]
    paths:
      - 'trading/stock_alpha_v1.py'
      - 'trading/paper_trade_v2.py'
      - 'trading/test_paper_trade_v2.py'
      - 'trading/pit_universe_fetch.py'
      - '.github/workflows/stock-alpha-v1.yml'
jobs:
  backtest:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install
        run: pip install pandas numpy yfinance pytest
      - name: Build PIT universe
        run: python trading/pit_universe_fetch.py --out data/pit/index_membership_history.csv --report data/pit/validation_report.json
      - name: Backtest
        run: python trading/stock_alpha_v1.py --membership data/pit/index_membership_history.csv --out data/stock_alpha_v1
      - name: Sanity checks
        run: |
          python - <<'PY'
          import json
          p=json.load(open('data/stock_alpha_v1/result.json'))
          s=p['stats']
          assert s['days']>1000, s
          assert s['cagr']==s['cagr'], s
          assert s['sharpe']==s['sharpe'], s
          print(json.dumps(p,indent=2))
          PY
      - name: Generate paper portfolio
        run: python trading/paper_trade_v2.py --membership data/pit/index_membership_history.csv --out data/paper_trade_v2
      - name: Safety tests
        run: pytest -q trading/test_paper_trade_v2.py
      - name: Paper-only gate
        run: |
          python - <<'PY'
          import json, math
          p=json.load(open('data/paper_trade_v2/paper_portfolio.json'))
          assert p['mode']=='PAPER_ONLY'
          assert p['real_orders'] is False
          assert len(p['positions'])==20
          assert len({x['symbol'] for x in p['positions']})==20
          stock_weight=sum(x['target_weight'] for x in p['positions'])
          assert math.isclose(stock_weight+p['cash_weight'],1.0,rel_tol=0,abs_tol=1e-9)
          assert math.isclose(stock_weight,p['gross_exposure'],rel_tol=0,abs_tol=1e-9)
          assert 0.0 <= p['cash_weight'] <= 1.0
          assert 0.0 <= p['gross_exposure'] <= 1.0
          print(json.dumps(p,indent=2))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: stock-alpha-v1
          path: data/stock_alpha_v1/
      - uses: actions/upload-artifact@v4
        with:
          name: stock-alpha-v2-paper-portfolio
          path: data/paper_trade_v2/
          retention-days: 30
