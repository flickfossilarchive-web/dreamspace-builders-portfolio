name: V14 Backtest Issue Trigger

on:
  issues:
    types: [opened]

permissions:
  contents: read
  issues: write

jobs:
  v14:
    if: contains(github.event.issue.title, '[RUN V14]')
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install pandas numpy requests yfinance
      - name: Run V14
        run: python trading/test_nifty_v14_diversified.py
      - name: Publish result to triggering issue
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
        run: |
          if [ -f nifty_v14_diversified_results.json ]; then
            gh issue comment "$ISSUE_NUMBER" --body "## V14 execution result\n\n\`\`\`json\n$(cat nifty_v14_diversified_results.json)\n\`\`\`"
          else
            gh issue comment "$ISSUE_NUMBER" --body "## V14 execution\n\nThe V14 script did not produce nifty_v14_diversified_results.json. Check the Actions job logs for the failure."
          fi
