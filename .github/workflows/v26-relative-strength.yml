name: V26 Relative Strength Robustness
on:
  push:
    paths:
      - 'trading/v26_relative_strength_rotation.py'
      - 'trading/test_nifty_v10_regime.py'
      - '.github/workflows/v26-relative-strength.yml'
  pull_request:
    paths:
      - 'trading/v26_relative_strength_rotation.py'
      - 'trading/test_nifty_v10_regime.py'
      - '.github/workflows/v26-relative-strength.yml'
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install numpy pandas yfinance requests
      - run: cd trading && python v26_relative_strength_rotation.py
      - uses: actions/upload-artifact@v4
        with:
          name: v26-relative-strength
          path: trading/v26_results.json
