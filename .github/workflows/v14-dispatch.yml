name: V14 Direct Dispatch

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['trading/test_nifty_v14_diversified.py', '.github/workflows/v14-dispatch.yml']

permissions:
  contents: read
  issues: write

jobs:
  backtest:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install pandas numpy requests yfinance
      - name: Execute frozen V14
        run: python -u trading/test_nifty_v14_diversified.py | tee v14_execution.log
      - name: Upload result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v14-final-result
          path: |
            nifty_v14_diversified_results.json
            v14_execution.log
          if-no-files-found: ignore
