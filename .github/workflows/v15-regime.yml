name: V15 Regime Diversified Backtest

on:
  push:
    branches: [main]
    paths:
      - 'trading/test_nifty_v15_regime_diversified.py'
      - 'trading/test_nifty_v10_regime.py'
      - '.github/workflows/v15-regime.yml'
  pull_request:
    branches: [main]
    paths:
      - 'trading/test_nifty_v15_regime_diversified.py'
      - 'trading/test_nifty_v10_regime.py'
      - '.github/workflows/v15-regime.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backtest:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: python -m pip install --upgrade pip && python -m pip install pandas numpy requests yfinance
      - name: Run V15
        run: python -u trading/test_nifty_v15_regime_diversified.py 2>&1 | tee v15_execution.log
      - name: Validate result
        run: |
          test -s nifty_v15_regime_results.json
          python - <<'PY'
          import json, math
          from pathlib import Path
          d=json.loads(Path('nifty_v15_regime_results.json').read_text())
          for k in ['strategy','benchmark','data_start','data_end','buy_hold_tri_cagr','full','windows','parameters','warnings']:
              assert k in d, f'missing {k}'
          assert d['data_start'] < d['data_end']
          assert isinstance(d['warnings'], list) and d['warnings']
          for k in ['cagr','total_return','max_drawdown','sharpe']:
              v=d['full'][k]; assert isinstance(v,(int,float)) and math.isfinite(v), k
          assert d['full']['rebalances'] > 0
          w=d['full']['avg_weights']; assert set(w)=={'NIFTY','GOLD','NASDAQ','CASH'}
          assert abs(sum(w.values())-1) < 1e-7
          assert all(isinstance(v,(int,float)) and math.isfinite(v) and v>=0 for v in w.values())
          assert d['windows']
          for x in d['windows']:
              for k in ['name','start','end','cagr','max_drawdown','sharpe']: assert k in x
          print(json.dumps(d, indent=2))
          PY
      - name: Upload final result
        uses: actions/upload-artifact@v4
        with:
          name: v15-final-result
          path: |
            nifty_v15_regime_results.json
            v15_execution.log
          if-no-files-found: error
