name: V16 Confirmed Regime Backtest

on:
  push:
    branches: [main]
    paths:
      - 'trading/test_nifty_v16_confirmed_regime.py'
      - 'trading/test_nifty_v10_regime.py'
      - '.github/workflows/v16-confirmed.yml'
  pull_request:
    branches: [main]
    paths:
      - 'trading/test_nifty_v16_confirmed_regime.py'
      - 'trading/test_nifty_v10_regime.py'
      - '.github/workflows/v16-confirmed.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  backtest:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: python -m pip install --upgrade pip && python -m pip install pandas numpy requests yfinance
      - name: Run V16
        run: python -u trading/test_nifty_v16_confirmed_regime.py 2>&1 | tee v16_execution.log
      - name: Validate
        run: |
          test -s nifty_v16_confirmed_results.json
          python - <<'PY'
          import json,math
          d=json.load(open('nifty_v16_confirmed_results.json'))
          for k in ['strategy','benchmark','data_start','data_end','buy_hold_tri_cagr','full','windows','parameters','warnings']: assert k in d
          for k in ['cagr','total_return','max_drawdown','sharpe']:
            assert math.isfinite(d['full'][k])
          assert d['full']['rebalances']>0
          assert abs(sum(d['full']['avg_weights'].values())-1)<1e-7
          assert d['windows']
          print(json.dumps(d,indent=2))
          PY
      - name: Publish verified result
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add nifty_v16_confirmed_results.json
          git commit -m 'results: publish verified V16 backtest' || exit 0
          git push
      - uses: actions/upload-artifact@v4
        with:
          name: v16-final-result
          path: |
            nifty_v16_confirmed_results.json
            v16_execution.log
          if-no-files-found: error
