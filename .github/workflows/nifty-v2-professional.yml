name: NIFTY V7 Adaptive Exposure Validation
on:
  push:
    branches: [nifty-system-v1]
  workflow_dispatch:
jobs:
  backtest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install pandas numpy yfinance
      - run: python trading/test_nifty_v7_professional.py
      - uses: actions/upload-artifact@v4
        with:
          name: nifty-v7-professional-results
          path: |
            nifty_v7_results.json
            nifty_v7_equity.csv
