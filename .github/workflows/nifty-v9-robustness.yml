name: NIFTY V9 Robustness Audit
on:
  push:
    branches: [main]
    paths:
      - 'trading/test_nifty_v9_robustness.py'
      - 'trading/test_nifty_v9_tri_overlay.py'
      - '.github/workflows/nifty-v9-robustness.yml'
  workflow_dispatch:
jobs:
  robustness:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install pandas numpy yfinance requests
      - run: python trading/test_nifty_v9_robustness.py
      - uses: actions/upload-artifact@v4
        with:
          name: nifty-v9-robustness-results
          path: nifty_v9_robustness_results.json
