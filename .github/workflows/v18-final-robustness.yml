name: V18 Final Robustness
on:
  push:
    branches: [fix/v17-real-robustness]
  pull_request:
    branches: [main]
  workflow_dispatch:
jobs:
  robustness:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: python -m pip install --upgrade pip && python -m pip install pandas numpy requests yfinance
      - name: Run final robustness
        run: python -u trading/test_nifty_v18_final_robustness.py 2>&1 | tee v18_final_robustness.log
      - name: Validate final robustness
        run: |
          python - <<'PY'
          import json, math
          d=json.load(open('nifty_v18_final_robustness_results.json'))
          assert d['data_start'] < d['data_end']
          assert len(d['parameter_perturbations']) >= 12
          assert len(d['walk_forward']) == 4
          assert len(d['cost_sensitivity']) == 9
          assert d['bootstrap']['iterations'] == 2000
          for x in d['parameter_perturbations']:
              assert all(math.isfinite(x[k]) for k in ['cagr','max_drawdown','sharpe','rebalances'])
          print('FINAL V18 ROBUSTNESS COMPLETE')
          print('Investment gate:', d['investment_gate']['pass'])
          PY
      - name: Upload final robustness artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v18-final-robustness
          path: |
            nifty_v18_final_robustness_results.json
            v18_final_robustness.log
          if-no-files-found: error
