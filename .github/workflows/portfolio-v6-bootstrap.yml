name: Portfolio V6 Bootstrap Monte Carlo
on:
  push:
    branches: [portfolio-v6-backtest]

jobs:
  bootstrap:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install pandas numpy
      - run: python trading/bootstrap_mc_v6.py
      - uses: actions/upload-artifact@v4
        with:
          name: portfolio-v6-bootstrap-mc
          path: portfolio_v6_bootstrap_mc.json
