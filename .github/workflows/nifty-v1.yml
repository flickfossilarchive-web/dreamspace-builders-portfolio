name: NIFTY V8 Core Plus Defensive Overlay Research
on:
  push:
    branches: [nifty-system-v1]
  workflow_dispatch:
jobs:
  backtest:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install pandas numpy yfinance
      - run: python trading/test_nifty_v8_overlay.py
      - uses: actions/upload-artifact@v4
        with:
          name: nifty-v8-professional-results
          path: nifty_v8_results.json
