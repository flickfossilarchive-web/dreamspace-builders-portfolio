name: Portfolio V6 Validation

on:
  push:
    branches:
      - portfolio-v6-backtest
  pull_request:
    branches:
      - main

jobs:
  validation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install pandas numpy
      - run: python trading/validate_portfolio_v6.py
      - uses: actions/upload-artifact@v4
        with:
          name: portfolio-v6-validation
          path: portfolio_v6_validation.json
          if-no-files-found: error
