name: NIFTY V13 Investor Core Backtest
on:
  push:
    branches: [main]
    paths:
      - 'trading/test_nifty_v13_core.py'
      - 'trading/test_nifty_v10_regime.py'
      - '.github/workflows/nifty-v13-core.yml'
  workflow_dispatch:
jobs:
  backtest:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install pandas numpy requests yfinance
      - name: Run V13
        run: python trading/test_nifty_v13_core.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: nifty-v13-core-results
          path: nifty_v13_core_results.json
          if-no-files-found: ignore
