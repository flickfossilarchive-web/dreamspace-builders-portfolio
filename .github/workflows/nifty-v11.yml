name: NIFTY V11 Adaptive Risk Backtest
on:
  push:
    branches: [main]
    paths:
      - 'trading/test_nifty_v11_adaptive.py'
      - 'trading/test_nifty_v10_regime.py'
      - '.github/workflows/nifty-v11.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  backtest:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install pandas numpy yfinance requests
      - run: python trading/test_nifty_v11_adaptive.py
      - uses: actions/upload-artifact@v4
        with:
          name: nifty-v11-adaptive-results
          path: nifty_v11_adaptive_results.json
