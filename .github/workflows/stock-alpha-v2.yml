name: Stock Alpha V2 Risk Validation
on:
  pull_request:
    branches: [main]
    paths:
      - 'trading/stock_alpha_v2.py'
      - 'trading/paper_trade_v2.py'
      - 'trading/test_paper_trade_v2.py'
      - 'trading/pit_universe_fetch.py'
      - '.github/workflows/stock-alpha-v2.yml'
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install
        run: pip install pandas numpy yfinance pytest
      - name: Build PIT universe
        run: python trading/pit_universe_fetch.py --out data/pit/index_membership_history.csv --report data/pit/validation_report.json
      - name: Run V2
        run: python trading/stock_alpha_v2.py --membership data/pit/index_membership_history.csv --out data/stock_alpha_v2
      - name: Validate output
        run: |
          python - <<'PY'
          import json
          p=json.load(open('data/stock_alpha_v2/result.json'))
          assert p['baseline']['days'] > 1000
          assert p['baseline']['cagr'] is not None
          assert p['baseline']['sharpe'] is not None
          assert p['baseline']['mean_selected_price_coverage'] >= .90
          assert all(v['days'] > 0 for v in p['crisis_periods'].values())
          print(json.dumps(p,indent=2))
          PY
      - name: Generate paper portfolio
        run: python trading/paper_trade_v2.py --membership data/pit/index_membership_history.csv --out data/paper_trade_v2
      - name: Safety tests
        run: pytest -q trading/test_paper_trade_v2.py
      - name: Validate paper portfolio
        run: |
          python - <<'PY'
          import json
          p=json.load(open('data/paper_trade_v2/paper_portfolio.json'))
          assert p['mode']=='PAPER_ONLY'
          assert p['real_orders'] is False
          assert len(p['positions'])==20
          assert abs(sum(x['target_weight'] for x in p['positions'])-1)<1e-9
          print(json.dumps(p,indent=2))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: stock-alpha-v2
          path: data/stock_alpha_v2/
      - uses: actions/upload-artifact@v4
        with:
          name: stock-alpha-v2-paper-portfolio
          path: data/paper_trade_v2/
          retention-days: 30
