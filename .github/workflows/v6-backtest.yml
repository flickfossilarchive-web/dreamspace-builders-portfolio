name: v6 Single Stock Test
on:
  push:
    branches: [backtest-v6-run]
  workflow_dispatch:
jobs:
  backtest:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install pandas numpy
      - run: python trading/test_single_v6.py
      - uses: actions/upload-artifact@v4
        with:
          name: single-tcs-v6-results
          path: |
            single_tcs_results.json
            single_tcs_trade_ledger.csv
