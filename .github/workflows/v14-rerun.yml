name: V14 Rerun Trigger
on:
  workflow_dispatch:
  push:
    paths:
      - 'trading/test_nifty_v14_diversified.py'
jobs:
  run-v14:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install pandas numpy yfinance
      - run: python trading/test_nifty_v14_diversified.py
      - uses: actions/upload-artifact@v4
        with:
          name: nifty-v14-diversified-results
          path: nifty_v14_diversified_results.json
